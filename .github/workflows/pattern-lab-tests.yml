name: Pattern Lab tests

on:
  push:
    branches:
      - feat/pattern-lab-textile-explorer
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pattern Lab dependencies
        run: python -m pip install -r requirements-pattern-lab.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
